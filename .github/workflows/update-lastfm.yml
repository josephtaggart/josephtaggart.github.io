name: Update Last.fm artists

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 0" # updates every sunday at 4:11 utc

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top artists from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }} 
          LASTFM_USERNAME: ${{ vars.LASTFM_USERNAME }}
        run: |
          test -n "$LASTFM_API_KEY" # checks if api key and username are blank/missing
          test -n "$LASTFM_USERNAME"
          mkdir -p _data
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "method=user.gettopartists" \ # calls top artists
            --data-urlencode "user=$LASTFM_USERNAME" \ # of my username
            --data-urlencode "api_key=$LASTFM_API_KEY" \ # api key
            --data-urlencode "period=overall" \ # all-time listening history
            --data-urlencode "limit=10" \ # specific number of artists
            --data-urlencode "format=json" \ # json so can be read by jekyll
            "https://ws.audioscrobbler.com/2.0/" > _data/lastfm.json
          jq -e '.topartists.artist | type == "array"' _data/lastfm.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]" # username for the commit
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/lastfm.json
          git diff --cached --quiet || git commit -m "Update Last.fm artists"
          git push
