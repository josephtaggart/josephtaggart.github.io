name: Update Last.fm artists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top artists from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ vars.LASTFM_USERNAME }}
        run: |
          test -n "$LASTFM_API_KEY"
          test -n "$LASTFM_USERNAME"
          mkdir -p _data
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "method=user.gettopartists" \
            --data-urlencode "user=$LASTFM_USERNAME" \
            --data-urlencode "api_key=$LASTFM_API_KEY" \
            --data-urlencode "period=overall" \
            --data-urlencode "limit=10" \
            --data-urlencode "format=json" \
            "https://ws.audioscrobbler.com/2.0/" > _data/lastfm.json
          jq -e '.topartists.artist | type == "array"' _data/lastfm.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/lastfm.json
          git diff --cached --quiet || git commit -m "Update Last.fm artists"
          git push
