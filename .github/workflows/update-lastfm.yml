name: Update Last.fm charts

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 0" # Every Sunday at 04:11 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch top artists, albums, and tracks from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ vars.LASTFM_USERNAME }}
        run: |
          mkdir -p _data

          # Top artists
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "method=user.gettopartists" \
            --data-urlencode "user=$LASTFM_USERNAME" \
            --data-urlencode "api_key=$LASTFM_API_KEY" \
            --data-urlencode "period=1month" \
            --data-urlencode "limit=10" \
            --data-urlencode "format=json" \
            "https://ws.audioscrobbler.com/2.0/" \
            > _data/lastfm.json

          # Top albums
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "method=user.gettopalbums" \
            --data-urlencode "user=$LASTFM_USERNAME" \
            --data-urlencode "api_key=$LASTFM_API_KEY" \
            --data-urlencode "period=1month" \
            --data-urlencode "limit=10" \
            --data-urlencode "format=json" \
            "https://ws.audioscrobbler.com/2.0/" \
            > _data/lastfm-albums.json

          # Top tracks
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "method=user.gettoptracks" \
            --data-urlencode "user=$LASTFM_USERNAME" \
            --data-urlencode "api_key=$LASTFM_API_KEY" \
            --data-urlencode "period=1month" \
            --data-urlencode "limit=10" \
            --data-urlencode "format=json" \
            "https://ws.audioscrobbler.com/2.0/" \
            > _data/lastfm-tracks.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/lastfm.json \
                  _data/lastfm-albums.json \
                  _data/lastfm-tracks.json

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update Last.fm charts"
            git push
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
